name: Build debug APK (no release signing secrets)
on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  android-debug:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Remove obsolete MRT Java before compilation
        shell: bash
        run: |
          set -euo pipefail
          echo "Checked out Git revision: $(git rev-parse --short HEAD)"
          # An upload that overwrites files does not delete tracked old Java classes.
          # Remove them in this runner checkout so javac cannot compile them.
          if [ -d app/src/main/java ]; then
            find app/src/main/java -type f \( -name 'Mrt*.java' -o -name 'Mrt*.kt' \) -print -delete
          fi
          rm -f app/src/main/assets/mrt_online_capture.js
          # The shared Edge code must remain independent of the retired MRT engine.
          if grep -R -n -E 'AudioModeCoordinator\.STOP_MRT|androidx\.webkit\.' app/src/main/java              --include='*.java' --include='*.kt'; then
            echo 'ERROR: obsolete MRT dependencies remain in Android Java sources.' >&2
            exit 1
          fi
          echo 'MRT checkout cleanup finished (Edge TTS preserved).'
      - name: Check that no obsolete MRT source can enter javac
        shell: bash
        run: |
          set -euo pipefail
          if [ -d app/src/main/java ] && find app/src/main/java -type f \( -name 'Mrt*.java' -o -name 'Mrt*.kt' \) | grep -q .; then
            echo 'ERROR: MRT Java files survived checkout cleanup.' >&2
            exit 1
          fi
          if grep -q -E 'Mrt(Download|Playback|Online|FileExplorer|Native)' app/src/main/AndroidManifest.xml; then
            echo 'ERROR: legacy MRT component remains registered in the manifest.' >&2
            exit 1
          fi
          echo 'PASS: javac will receive Edge-only sources.'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Validate source tests
        run: |
          set -e
          bash scripts/run-current-tests.sh
      - name: Build v1.11.42 debug APK
        run: bash scripts/gradle-with-diagnostics.sh --no-daemon :app:assembleDebug --stacktrace
      - name: Upload complete Gradle compile log (even when failed)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-logs-debug
          path: |
            build-log.txt
            build-diagnostics.txt
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ChitalkaRSVP-v1.11.42-beta-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
