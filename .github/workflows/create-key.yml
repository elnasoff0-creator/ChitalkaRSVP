
name: Create Android Signing Key

on:
  workflow_dispatch:

jobs:
  generate-key:
    runs-on: ubuntu-latest

    steps:
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Generate signing key
        env:
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          test -n "$STORE_PASSWORD"
          test -n "$KEY_PASSWORD"

          keytool -genkeypair \
            -keystore reader-release.jks \
            -alias reader \
            -keyalg RSA \
            -keysize 3072 \
            -validity 10000 \
            -storepass "$STORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            -dname "CN=Chitalka RSVP, O=Personal"

      - name: Download signing key
        uses: actions/upload-artifact@v4
        with:
          name: reader-signing-key
          path: reader-release.jks
          retention-days: 1
