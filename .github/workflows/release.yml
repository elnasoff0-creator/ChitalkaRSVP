name: Build signed release APK (signing secrets)

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android-release:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android 35 build packages
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Check required signing secrets
        env:
          RELEASE_KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        shell: bash
        run: |
          set -euo pipefail
          for secret_name in RELEASE_KEYSTORE_B64 RELEASE_KEYSTORE_PASSWORD RELEASE_KEY_PASSWORD RELEASE_KEY_ALIAS; do
            if [ -z "${!secret_name}" ]; then
              echo "::error::Missing required repository secret: $secret_name"
              exit 1
            fi
          done
          echo 'All four release signing secrets are configured.'

      - name: Verify TTS scrolling, pet bubble and regressions v1.11.189
        run: |
          bash qa/check_java_syntax.sh
          bash qa/test_reader_tts_scroll_189.sh
          bash qa/test_edge_startup_188.sh
          python3 qa/check_v188_contracts.py
          bash qa/test_edge_sentence_blocks_182.sh
          bash qa/test_edge_sentence_seek.sh
          python3 qa/check_v182_contracts.py
          bash qa/test_edge_live_buffer.sh
          bash qa/test_edge_transitions_183.sh
          bash qa/test_edge_prefetch_planner.sh
          bash qa/check_edge_serial_playback.sh
          bash qa/test_edge_startup_singleflight.sh
          bash qa/test_edge_priority.sh
          bash qa/test_edge_429_silent.sh
          bash qa/test_edge_reuse_pool.sh
          python3 qa/test_edge_idle_expiry_compilation.py
          bash qa/test_pet_quotes_184.sh
          python3 qa/test_quotes_sqlite_184.py
          bash qa/test_reader_selection_navigation_185.sh
          bash qa/test_word_boundary_refresh_186.sh
          bash qa/test_reader_touch_policy_186.sh
          python3 qa/check_v186_contracts.py
          mkdir -p /tmp/reader-qa-186
          javac -d /tmp/reader-qa-186 qa/ReaderActivityMethodCheck.java
          java -cp /tmp/reader-qa-186 ReaderActivityMethodCheck

      - name: Build unsigned release APK
        run: gradle --no-daemon :app:assembleRelease --stacktrace

      - name: Sign and verify release APK
        shell: bash
        env:
          RELEASE_KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        run: |
          set -euo pipefail
          unsigned_apk='app/build/outputs/apk/release/app-release-unsigned.apk'
          test -s "$unsigned_apk" || { echo '::error::Release APK not found'; exit 1; }
          build_tools="$ANDROID_HOME/build-tools/35.0.0"
          test -x "$build_tools/zipalign"
          test -x "$build_tools/apksigner"
          test -x "$build_tools/aapt"

          # The APK manifest (not the tag or a hardcoded constant) is the source of truth.
          app_version="$("$build_tools/aapt" dump badging "$unsigned_apk" | sed -n "s/^package:.*versionName='\([^']*\)'.*/\1/p" | head -n 1)"
          test -n "$app_version" || { echo '::error::Cannot read versionName from APK'; exit 1; }
          [[ "$app_version" =~ ^[0-9A-Za-z._-]+$ ]] || { echo '::error::Invalid APK versionName'; exit 1; }
          app_code="$("$build_tools/aapt" dump badging "$unsigned_apk" | sed -n "s/^package:.*versionCode='\([^']*\)'.*/\1/p" | head -n 1)"
          test -n "$app_code" || { echo '::error::Cannot read versionCode'; exit 1; }
          # Both v1.11.176-beta and v1.11.176 may identify a beta APK.
          # Never accept a tag from a different numeric application version.
          base_version="${app_version%%-*}"
          if [[ "$GITHUB_REF" == refs/tags/v* && "$GITHUB_REF_NAME" != "v$app_version" && "$GITHUB_REF_NAME" != "v$base_version" ]]; then
            echo "::error::Git tag $GITHUB_REF_NAME does not match APK version v$app_version"
            exit 1
          fi
          release_apk="ChitalkaRSVP-v${app_version}.apk"
          echo "RELEASE_APK=$release_apk" >> "$GITHUB_ENV"
          echo "APK manifest versionName: $app_version"

          keystore="$RUNNER_TEMP/chitalka-release-${GITHUB_RUN_ID}.jks"
          aligned_apk="$RUNNER_TEMP/chitalka-aligned-${GITHUB_RUN_ID}.apk"
          trap 'rm -f "$keystore" "$aligned_apk"' EXIT
          umask 077
          printf '%s' "$RELEASE_KEYSTORE_B64" | base64 --decode > "$keystore"
          test -s "$keystore" || { echo '::error::Decoded keystore is empty'; exit 1; }
          mkdir -p dist
          "$build_tools/zipalign" -f -p 4 "$unsigned_apk" "$aligned_apk"
          "$build_tools/apksigner" sign \
            --ks "$keystore" \
            --ks-key-alias "$RELEASE_KEY_ALIAS" \
            --ks-pass env:RELEASE_KEYSTORE_PASSWORD \
            --key-pass env:RELEASE_KEY_PASSWORD \
            --out "dist/$release_apk" "$aligned_apk"
          "$build_tools/apksigner" verify --verbose --print-certs "dist/$release_apk"
          signed_version="$("$build_tools/aapt" dump badging "dist/$release_apk" | sed -n "s/^package:.*versionName='\([^']*\)'.*/\1/p" | head -n 1)"
          test "$signed_version" = "$app_version" || { echo '::error::Signed APK manifest version changed'; exit 1; }
          (cd dist && sha256sum "$release_apk" > SHA256SUMS.txt)

      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: signed-release-apk
          path: |
            dist/${{ env.RELEASE_APK }}
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release for version tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          # APK filename follows its manifest version, not the optional abbreviated Git tag.
          [[ -f "dist/$RELEASE_APK" ]] || { echo "::error::Missing signed APK: $RELEASE_APK"; exit 1; }
          apk_version="${RELEASE_APK#ChitalkaRSVP-v}"
          apk_version="${apk_version%.apk}"
          base_version="${apk_version%%-*}"
          [[ "$tag" == "v$apk_version" || "$tag" == "v$base_version" ]] || { echo "::error::Refusing version mismatch: $tag / $RELEASE_APK"; exit 1; }
          if gh release view "$tag" >/dev/null 2>&1; then
            # Remove only stale APK names under this tag; preserve all other assets.
            while IFS= read -r old_apk; do
              if [[ -n "$old_apk" && "$old_apk" != "$RELEASE_APK" ]]; then
                gh release delete-asset "$tag" "$old_apk" --yes
              fi
            done < <(gh release view "$tag" --json assets --jq '.assets[].name | select(endswith(".apk"))')
            gh release upload "$tag" "dist/$RELEASE_APK" dist/SHA256SUMS.txt --clobber
            if [[ "$apk_version" == *-beta* || "$apk_version" == *-alpha* || "$apk_version" == *-rc* ]]; then
              gh release edit "$tag" --prerelease --title "ChitalkaRSVP $apk_version"
            fi
          elif [[ "$apk_version" == *-beta* || "$apk_version" == *-alpha* || "$apk_version" == *-rc* ]]; then
            gh release create "$tag" "dist/$RELEASE_APK" dist/SHA256SUMS.txt \
              --title "ChitalkaRSVP $apk_version" --notes 'Signed Android release APK.' --prerelease
          else
            gh release create "$tag" "dist/$RELEASE_APK" dist/SHA256SUMS.txt \
              --title "ChitalkaRSVP ${tag#v}" --notes 'Signed Android release APK.'
          fi
