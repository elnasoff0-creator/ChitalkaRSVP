
name: Publish signed APK release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04

    env:
      ANDROID_HOME: ${{ github.workspace }}/android-sdk
      ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK commandline tools
        run: |
          mkdir -p "$ANDROID_HOME/cmdline-tools"

          curl -fL \
            https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip \
            -o cmdline-tools.zip

          unzip -q cmdline-tools.zip \
            -d "$ANDROID_HOME/cmdline-tools"

          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" \
             "$ANDROID_HOME/cmdline-tools/latest"

          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/build-tools/35.0.0" >> "$GITHUB_PATH"

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "platform-tools"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.7'

      - name: Build unsigned release
        run: gradle assembleRelease --stacktrace

      - name: Sign with persistent release key
        env:
          RELEASE_KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        run: |
          set -euo pipefail

          test -n "$RELEASE_KEYSTORE_B64" || {
            echo "Missing release signing secrets"
            exit 1
          }

          printf '%s' "$RELEASE_KEYSTORE_B64" \
            | base64 -d > /tmp/release.jks

          mkdir -p dist

          zipalign -f -p 4 \
            app/build/outputs/apk/release/app-release-unsigned.apk \
            dist/ChitalkaRSVP-aligned.apk

          apksigner sign \
            --ks /tmp/release.jks \
            --ks-key-alias "$RELEASE_KEY_ALIAS" \
            --ks-pass "env:RELEASE_KEYSTORE_PASSWORD" \
            --key-pass "env:RELEASE_KEY_PASSWORD" \
            --out dist/ChitalkaRSVP.apk \
            dist/ChitalkaRSVP-aligned.apk

          apksigner verify --verbose dist/ChitalkaRSVP.apk

          rm -f /tmp/release.jks
          rm -f dist/ChitalkaRSVP-aligned.apk

          cd dist
          sha256sum ChitalkaRSVP.apk > SHA256SUMS.txt

      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v6
        with:
          name: ChitalkaRSVP-signed
          path: |
            dist/ChitalkaRSVP.apk
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release exists. Updating assets..."

            gh release upload "$GITHUB_REF_NAME" \
              dist/ChitalkaRSVP.apk \
              dist/SHA256SUMS.txt \
              --clobber
          else
            echo "Creating a new release..."

            gh release create "$GITHUB_REF_NAME" \
              dist/ChitalkaRSVP.apk \
              dist/SHA256SUMS.txt \
              --title "Читалка RSVP ${GITHUB_REF_NAME#v}" \
              --notes "Обновление Читалки RSVP." \
              --latest
          fi
