name: Build signed release APK (signing secrets)

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android-release:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android 35 build packages
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Check required signing secrets
        env:
          RELEASE_KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        shell: bash
        run: |
          set -euo pipefail
          for secret_name in RELEASE_KEYSTORE_B64 RELEASE_KEYSTORE_PASSWORD RELEASE_KEY_PASSWORD RELEASE_KEY_ALIAS; do
            if [ -z "${!secret_name}" ]; then
              echo "::error::Missing required repository secret: $secret_name"
              exit 1
            fi
          done
          echo 'All four release signing secrets are configured.'

      - name: Build unsigned release APK
        run: gradle --no-daemon :app:assembleRelease --stacktrace

      - name: Sign and verify release APK
        shell: bash
        env:
          RELEASE_KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        run: |
          set -euo pipefail
          unsigned_apk='app/build/outputs/apk/release/app-release-unsigned.apk'
          test -s "$unsigned_apk" || { echo '::error::Release APK not found'; exit 1; }
          build_tools="$ANDROID_HOME/build-tools/35.0.0"
          test -x "$build_tools/zipalign"
          test -x "$build_tools/apksigner"

          keystore="$RUNNER_TEMP/chitalka-release-${GITHUB_RUN_ID}.jks"
          aligned_apk="$RUNNER_TEMP/chitalka-aligned-${GITHUB_RUN_ID}.apk"
          trap 'rm -f "$keystore" "$aligned_apk"' EXIT
          umask 077
          printf '%s' "$RELEASE_KEYSTORE_B64" | base64 --decode > "$keystore"
          test -s "$keystore" || { echo '::error::Decoded keystore is empty'; exit 1; }

          mkdir -p dist
          "$build_tools/zipalign" -f -p 4 "$unsigned_apk" "$aligned_apk"
          "$build_tools/apksigner" sign \
            --ks "$keystore" \
            --ks-key-alias "$RELEASE_KEY_ALIAS" \
            --ks-pass env:RELEASE_KEYSTORE_PASSWORD \
            --key-pass env:RELEASE_KEY_PASSWORD \
            --out dist/ChitalkaRSVP-v1.11.44-beta.apk "$aligned_apk"
          "$build_tools/apksigner" verify --verbose --print-certs dist/ChitalkaRSVP-v1.11.44-beta.apk
          (cd dist && sha256sum ChitalkaRSVP-v1.11.44-beta.apk > SHA256SUMS.txt)

      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: ChitalkaRSVP-v1.11.44-beta-signed-release
          path: |
            dist/ChitalkaRSVP-v1.11.44-beta.apk
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release for version tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/ChitalkaRSVP-v1.11.44-beta.apk dist/SHA256SUMS.txt --clobber
          elif [[ "$tag" == *-beta* || "$tag" == *-alpha* || "$tag" == *-rc* ]]; then
            gh release create "$tag" dist/ChitalkaRSVP-v1.11.44-beta.apk dist/SHA256SUMS.txt \
              --title "ChitalkaRSVP ${tag#v}" --notes 'Signed Android release APK.' --prerelease
          else
            gh release create "$tag" dist/ChitalkaRSVP-v1.11.44-beta.apk dist/SHA256SUMS.txt \
              --title "ChitalkaRSVP ${tag#v}" --notes 'Signed Android release APK.'
          fi
